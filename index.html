<!-- ===== LOGIN ===== -->
<div id="login" class="login hide" role="dialog" aria-labelledby="loginTitle">
  <form class="card login-card" id="loginForm" novalidate autocomplete="on">
    <div class="row" style="gap:14px">
      <div class="brand-logo"><svg class="i lg"><use href="#i-cart"/></svg></div>
      <div><h1 id="loginTitle">KasirKu</h1><p class="muted">Kasir digital untuk UMKM</p></div>
    </div>
    <div class="field"><label for="lgEmail">Email akun</label><input id="lgEmail" class="input" type="email" inputmode="email" autocomplete="username" placeholder="nama@email.com" required></div>
    <div class="field"><label for="lgPin">PIN (4–6 digit)</label><input id="lgPin" class="input pin-in" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password" placeholder="••••" required></div>
    <p id="lgErr" class="err" role="alert" aria-live="polite"></p>
    <button id="lgBtn" class="btn primary block" type="submit" style="min-height:52px">Masuk</button>
    <p class="hint tc">Hanya akun yang terdaftar oleh Owner yang dapat masuk.</p>
  </form>
</div>

<!-- ===== APLIKASI ===== -->
<div id="app" class="app hide">
  <aside id="side" class="side" aria-label="Menu utama">
    <div class="brand">
      <div class="brand-logo" id="brandLogo"><svg class="i lg"><use href="#i-cart"/></svg></div>
      <div><b id="brandName">KasirKu</b><small>Kasir Digital UMKM</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="sync" id="syncBox" role="status" aria-live="polite"><span class="dot" id="syncDot"></span><span id="syncTxt">Tersinkron</span></div>
      <button class="profile" id="profileBtn" aria-haspopup="menu">
        <span class="avatar" id="avatar">K</span>
        <div class="grow"><b id="pName">—</b><small id="pRole">—</small></div>
        <svg class="i sm"><use href="#i-logout"/></svg>
      </button>
    </div>
  </aside>
  <div id="sideScrim" class="side-scrim hide"></div>

  <div class="main">
    <header class="top">
      <button class="iconbtn menu-btn" id="menuBtn" aria-label="Buka menu"><svg class="i"><use href="#i-menu"/></svg></button>
      <div class="grow"><h1 id="pageTitle">Kasir</h1><p id="pageSub"></p></div>
      <div class="search" id="searchBox">
        <svg class="i sm"><use href="#i-search"/></svg>
        <input id="gSearch" type="search" placeholder="Cari…" aria-label="Pencarian" autocomplete="off"><kbd>Ctrl K</kbd>
      </div>
      <button class="iconbtn" id="bellBtn" aria-label="Notifikasi stok menipis" aria-haspopup="true"><svg class="i"><use href="#i-bell"/></svg><span class="badge-dot hide" id="bellN">0</span></button>
      <button class="iconbtn" id="themeBtn" aria-label="Ganti tema terang/gelap"><svg class="i" id="themeIco"><use href="#i-moon"/></svg></button>
    </header>

    <main id="views">
      <section id="v-kasir" class="view pos hide" aria-label="Kasir"></section>
      <section id="v-dashboard" class="view hide" aria-label="Dashboard"></section>
      <section id="v-produk" class="view hide" aria-label="Produk dan stok"></section>
      <section id="v-riwayat" class="view hide" aria-label="Riwayat transaksi"></section>
      <section id="v-laporan" class="view hide" aria-label="Laporan"></section>
      <section id="v-pengguna" class="view hide" aria-label="Pengguna"></section>
      <section id="v-pengaturan" class="view hide" aria-label="Pengaturan"></section>
    </main>
  </div>
</div>

<div id="overlay"></div>
<div id="toasts" class="toasts" aria-live="polite" role="status"></div>
<div id="printArea" aria-hidden="true"></div>

<script src="js/config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script defer src="js/struk-engine.js"></script>
<script defer src="js/struk-printer.js"></script>
<script defer src="js/struk-ui.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/pwa.js"></script>
</body>
</html>
